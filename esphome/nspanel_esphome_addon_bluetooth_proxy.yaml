# standalone Bluetooth Proxy and BLE tracker with smart scanning (only when HA is connected)

## not compaitble with ESPectre - use the espectre_with_bluetooth addon for that

bluetooth_proxy:

esp32_ble_tracker:
  scan_parameters:
    continuous: false
    active: true
    
api:
  on_client_connected:
    then:
      - esp32_ble_tracker.start_scan:
          continuous: true
  on_client_disconnected:
    then:
      - esp32_ble_tracker.stop_scan:

esphome:
  build_flags:
    - -D NSPANEL_EASY_ADDON_BLUETOOTH_PROXY
